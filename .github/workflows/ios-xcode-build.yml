name: iOS Xcode project build
on:
  push:
    paths:
      - "native/ios/**"
      - ".github/workflows/ios-xcode-build.yml"
  pull_request:
    paths:
      - "native/ios/**"
      - ".github/workflows/ios-xcode-build.yml"
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: native/ios
        run: xcodegen generate --spec project.yml
      - name: Build iOS app and AUv3 extension
        working-directory: native/ios
        run: |
          xcodebuild \
            -project NexusEqualizer.xcodeproj \
            -scheme NexusEqualizer \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
