name: Android native build

on:
  push:
    branches: [main]
    paths:
      - 'native/android/**'
      - 'src/**'
      - '.github/workflows/native-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/android/**'
      - 'src/**'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the Studio web UI for the Android WebView
        run: |
          npm install
          npm test
          NEXUS_NATIVE=true npm run build
          rm -rf native/android/app/src/main/assets/studio
          mkdir -p native/android/app/src/main/assets/studio
          cp -r dist/. native/android/app/src/main/assets/studio/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests (plan to DynamicsProcessing mapping)
        working-directory: native/android
        run: gradle testDebugUnitTest
      - name: Assemble debug APK
        working-directory: native/android
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-equalizer-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish debug APK as a pre-release (download link for phones)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp native/android/app/build/outputs/apk/debug/app-debug.apk NEXUS-EQ-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest NEXUS-EQ-debug.apk --prerelease \
            --target "${{ github.event.pull_request.head.sha || github.sha }}" \
            --title "NEXUS EQ debug (latest)" \
            --notes "APK de debug para testes. Instale em Android 9+ permitindo fontes desconhecidas. Commit: ${{ github.event.pull_request.head.sha || github.sha }}"
