name: iOS AUv3 source validation

on:
  push:
    branches: [main]
    paths:
      - 'native/ios/AudioUnitExtension/**'
      - 'native/ios/NexusEqualizerCore/**'
      - 'native/ios/project.yml'
      - '.github/workflows/ios-auv3-typecheck.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/ios/AudioUnitExtension/**'
      - 'native/ios/NexusEqualizerCore/**'
      - 'native/ios/project.yml'
      - '.github/workflows/ios-auv3-typecheck.yml'
  workflow_dispatch:

jobs:
  typecheck-auv3:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: native/ios
        run: xcodegen generate --spec project.yml
      - name: Build AUv3 and app against iOS device SDK
        working-directory: native/ios
        run: |
          xcodebuild \
            -project NexusEqualizer.xcodeproj \
            -scheme NexusEqualizer \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
