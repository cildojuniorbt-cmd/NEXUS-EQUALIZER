name: iOS DSP core tests

on:
  push:
    branches: [main]
    paths:
      - 'native/ios/NexusEqualizerCore/**'
      - '.github/workflows/ios-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/ios/NexusEqualizerCore/**'
      - '.github/workflows/ios-core.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.10'
      - name: Run portable DSP tests
        working-directory: native/ios/NexusEqualizerCore
        run: swift test
